<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>infra-watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* BGO retro-terminal theme tokens — dark theme only for now. */
    --iw-bg: #0B0C0A;       --iw-panel: #111210;    --iw-panel-2: #191A15;
    --iw-line: #3A3520;     --iw-line-soft: #24231A;
    --iw-text: #F2E9C8;     --iw-text-2: #B3AA88;   --iw-text-3: #85806A;
    --iw-hover: rgba(255,221,53,0.07); --iw-canvas: #0D0E0B;
    --iw-ok: #7CE38B;       --iw-warn: #FFDD35;     --iw-down: #FF6B4A;
    --iw-act: #FFDD35;      --iw-on-act: #14150F;
    --iw-scan: rgba(255,221,53,0.045);
  }

  * { border-radius: 0; box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--iw-bg);
    color: var(--iw-text);
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  @keyframes iwblip { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  #topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 11px 20px;
    background: var(--iw-panel);
    border-bottom: 1px solid var(--iw-line);
  }
  .topbar-brand { display: flex; align-items: center; gap: 12px; }
  .topbar-accent { width: 10px; height: 16px; background: var(--iw-act); flex-shrink: 0; }
  .topbar-title { font-size: 14px; font-weight: 600; letter-spacing: 0.16em; color: var(--iw-act); }

  #subbar {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    padding: 10px 20px;
    background: var(--iw-bg);
    border-bottom: 1px solid var(--iw-line-soft);
  }

  #view-tabs { display: flex; border: 1px solid var(--iw-line); }
  #view-tabs .view-tab {
    border: 0;
    border-left: 1px solid var(--iw-line);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    padding: 8px 15px;
    background: transparent;
    color: var(--iw-text-2);
  }
  #view-tabs .view-tab:first-child { border-left: 0; }
  #view-tabs .view-tab.active { background: var(--iw-act); color: var(--iw-on-act); }

  #status-strip { display: flex; align-items: center; gap: 18px; font-size: 12px; }
  .status-count {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--iw-text-2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .status-count strong { color: var(--iw-text); }
  .count-dot { width: 7px; height: 7px; flex-shrink: 0; }
  .count-dot.dot-healthy { background: var(--iw-ok); }
  .count-dot.dot-at-risk { background: var(--iw-warn); } /* steady — AT RISK never blinks */
  .count-dot.dot-offline { background: var(--iw-down); animation: iwblip 1.4s steps(2) infinite; } /* only OFFLINE blinks */
  .count-dot.dot-unknown { background: transparent; border: 1px dashed var(--iw-text-3); }

  #subbar-hint {
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--iw-text-3);
    white-space: nowrap;
  }

  #canvas-area { flex: 1; min-height: 0; position: relative; background: var(--iw-canvas); }
  #scanline {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, var(--iw-scan) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 3;
  }
  #scene, #topology, #list-view { position: absolute; inset: 0; }
  #scene { display: none; }
  #topology { display: block; }
  #list-view {
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--iw-text-3);
    font-size: 13px;
    letter-spacing: 0.12em;
  }

  #panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 320px;
    background: #1d2026;
    color: #e6e8eb;
    box-shadow: -2px 0 12px rgba(0,0,0,0.4);
    transform: translateX(100%);
    transition: transform 0.2s ease-out;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    z-index: 10;
  }
  #panel.open { transform: translateX(0); }
  #panel h2 { margin: 0 0 16px; font-size: 18px; }
  #panel .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2b2f37; font-size: 13px; }
  #panel .label { color: #9aa1ac; }
  #panel .value { font-weight: 600; }
  #panel .status-up { color: #3ddc84; }
  #panel .status-down { color: #ff5c5c; }
  #panel .status-unknown { color: #9aa1ac; }
  #panel-close { position: absolute; top: 14px; right: 16px; cursor: pointer; color: #9aa1ac; background: none; border: none; font-size: 16px; }

  #panel .ports-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    padding-bottom: 4px;
    color: #9aa1ac;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  #panel .info-tip {
    cursor: help;
    color: #6b7280;
    font-size: 12px;
    border: 1px solid #3a3f47;
    border-radius: 50%;
    width: 14px;
    height: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  #panel .port-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #24272e;
    font-size: 12px;
  }
  #panel .port-label { display: flex; align-items: center; gap: 8px; color: #c3c7ce; }
  #panel .port-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  #panel .port-dot.status-up { background: #3ddc84; }
  #panel .port-dot.status-down { background: #ff5c5c; }
  #panel .port-dot.status-unknown { background: #6b6f76; }
  #panel .port-status-text { font-weight: 600; }
  #panel .ports-empty { color: #6b7280; font-size: 12px; padding: 6px 0; font-style: italic; }

  #topology svg { width: 100%; height: 100%; }
  #topology .topo-node { cursor: pointer; }
  #topology .topo-node circle { stroke: #14161a; stroke-width: 3; }
  #topology .topo-label {
    fill: #e6e8eb;
    font-size: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-anchor: middle;
  }

  #chat-bar {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 360px;
    height: 44px;
    background: #1d2026;
    border: 1px solid #2b2f37;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    color: #e6e8eb;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    z-index: 20;
    user-select: none;
  }
  #chat-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; }

  #chat-box {
    position: fixed;
    left: 50%;
    bottom: 44px;
    transform: translateX(-50%);
    width: 360px;
    height: 380px;
    background: #1d2026;
    border: 1px solid #2b2f37;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.4);
    color: #e6e8eb;
    display: flex;
    flex-direction: column;
    z-index: 19;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.2s ease-out, opacity 0.15s ease-out;
  }
  #chat-box.open { max-height: 380px; opacity: 1; }

  #chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #chat-history .msg { max-width: 85%; padding: 6px 10px; border-radius: 10px; line-height: 1.4; }
  #chat-history .msg.user { align-self: flex-end; background: #2b6ef2; color: #fff; }
  #chat-history .msg.agent { align-self: flex-start; background: #2b2f37; color: #e6e8eb; }
  #chat-history .msg.pending { opacity: 0.6; font-style: italic; }

  #chat-form {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid #2b2f37;
  }
  #chat-input {
    flex: 1;
    background: #14161a;
    border: 1px solid #2b2f37;
    border-radius: 6px;
    padding: 8px 10px;
    color: #e6e8eb;
    font-size: 13px;
  }
  #chat-input:focus { outline: none; border-color: #2b6ef2; }
  #chat-send {
    background: #2b6ef2;
    border: none;
    border-radius: 6px;
    color: #fff;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #chat-send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div id="topbar">
    <div class="topbar-brand">
      <div class="topbar-accent"></div>
      <div class="topbar-title">INFRA-WATCH</div>
    </div>
  </div>

  <div id="subbar">
    <div id="view-tabs">
      <button class="view-tab active" data-view="topology">TOPOLOGY</button>
      <button class="view-tab" data-view="3d">RACK</button>
      <button class="view-tab" data-view="list">LIST</button>
    </div>

    <div id="status-strip">
      <div class="status-count"><span class="count-dot dot-healthy"></span><strong id="count-healthy">0</strong> HEALTHY</div>
      <div class="status-count"><span class="count-dot dot-at-risk"></span><strong id="count-at-risk">0</strong> AT RISK</div>
      <div class="status-count"><span class="count-dot dot-offline"></span><strong id="count-offline">0</strong> OFFLINE</div>
      <div class="status-count"><span class="count-dot dot-unknown"></span><strong id="count-unknown">0</strong> UNKNOWN</div>
    </div>

    <div id="subbar-hint">CLICK A DEVICE FOR DETAILS</div>
  </div>

  <div id="canvas-area">
    <div id="scanline"></div>
    <div id="scene"></div>
    <div id="topology"></div>
    <div id="list-view">LIST VIEW — NOT YET BUILT</div>
  </div>

  <div id="panel">
    <button id="panel-close">✕</button>
    <h2 id="panel-name">—</h2>
    <div class="row"><span class="label">Host</span><span class="value" id="panel-host">—</span></div>
    <div class="row"><span class="label">Status</span><span class="value" id="panel-status">—</span></div>
    <div class="row"><span class="label">Latency</span><span class="value" id="panel-latency">—</span></div>
    <div class="row"><span class="label">Last checked</span><span class="value" id="panel-last-checked">—</span></div>
    <div class="row"><span class="label">Severity</span><span class="value" id="panel-severity">—</span></div>
    <div class="row">
      <span class="label">Port summary</span>
      <span class="value" id="panel-port-summary">—</span>
    </div>

    <div class="ports-header">
      Ports
      <span class="info-tip" title="Simulated fixture data for now — not live SNMP data yet. Real per-port monitoring is planned as a later step.">ⓘ</span>
    </div>
    <div id="panel-ports-list"></div>
  </div>

  <div id="chat-box">
    <div id="chat-history"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask infra-watch..." autocomplete="off" />
      <button id="chat-send" type="submit">Send</button>
    </form>
  </div>
  <div id="chat-bar"><span class="dot"></span>infra-watch</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

// Hoisted here (used by the 3D scene's own sizing below, the view-tab
// switcher, and the topology renderer) — the shell now gives #scene a
// container smaller than the full viewport (below the top/sub bars), so
// the renderer must size itself off this element, not window dimensions.
const sceneEl = document.getElementById("scene");
const topologyEl = document.getElementById("topology");
const listViewEl = document.getElementById("list-view");

const STATUS_COLOR = {
  up: 0x3ddc84,
  down: 0xff5c5c,
  unknown: 0x6b6f76,
  mixed: 0xff9800, // master LED only: some ports up, some down
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);

function getSceneSize() {
  return { width: sceneEl.clientWidth, height: sceneEl.clientHeight };
}

// #scene may start hidden (display:none) if Topology is the default tab,
// in which case it has zero layout size — fall back to the window's
// aspect ratio just so the camera/renderer aren't created degenerate.
// resizeSceneRenderer() re-measures for real the moment #scene actually
// becomes visible (see the tab-click handler below).
const initialSize = getSceneSize();
const camera = new THREE.PerspectiveCamera(
  45,
  (initialSize.width || window.innerWidth) / (initialSize.height || window.innerHeight),
  0.1,
  100
);
camera.position.set(0, 4.4, 15.5);
camera.lookAt(0, 0.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(initialSize.width || window.innerWidth, initialSize.height || window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
sceneEl.appendChild(renderer.domElement);

function resizeSceneRenderer() {
  const { width, height } = getSceneSize();
  if (width === 0 || height === 0) return; // hidden right now — nothing to size to
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x1b1e24 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
scene.add(floor);

window.addEventListener("resize", resizeSceneRenderer);

// A 1U rack switch: a wide, thin, shallow black chassis (~10:1 width:height)
// with a recessed lighter-gray panel carrying a row of flat square port
// LEDs, plus one distinct square LED near the left edge for overall status.
const CHASSIS_WIDTH = 4.2, CHASSIS_HEIGHT = 0.42, CHASSIS_DEPTH = 1.3;
const PANEL_WIDTH = CHASSIS_WIDTH * 0.58, PANEL_HEIGHT = CHASSIS_HEIGHT * 0.55;
const PANEL_X = CHASSIS_WIDTH * 0.12;
const OVERALL_LED_X = -CHASSIS_WIDTH / 2 + 0.28;
const DEFAULT_PORT_LED_COUNT = 4; // used only when a device has no ports data at all
const DEVICE_SPACING = CHASSIS_WIDTH + 1.0;

const chassisGeometry = new THREE.BoxGeometry(CHASSIS_WIDTH, CHASSIS_HEIGHT, CHASSIS_DEPTH);
const chassisMaterialBase = { color: 0x0c0c0e, roughness: 0.75, metalness: 0.2 };

const panelGeometry = new THREE.BoxGeometry(PANEL_WIDTH, PANEL_HEIGHT, 0.02);
const panelMaterialBase = { color: 0x53565e, roughness: 0.55, metalness: 0.15 };

const ledGeometry = new THREE.BoxGeometry(0.09, 0.09, 0.015);
const overallLedGeometry = new THREE.BoxGeometry(0.16, 0.16, 0.02);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

// device.name -> { group, chassisMesh, panelMesh, overallLed: {mesh, material}, ports: [{mesh, material}], label, data }
const devices = new Map();
let clock = new THREE.Clock();

function buildDevice(report, index, total) {
  const name = report.name;
  const startX = -((total - 1) * DEVICE_SPACING) / 2;

  const group = new THREE.Group();
  group.position.set(startX + index * DEVICE_SPACING, CHASSIS_HEIGHT / 2, 0);

  const chassisMaterial = new THREE.MeshStandardMaterial(chassisMaterialBase);
  const chassisMesh = new THREE.Mesh(chassisGeometry, chassisMaterial);
  chassisMesh.userData.deviceName = name;
  group.add(chassisMesh);

  const panelMaterial = new THREE.MeshStandardMaterial(panelMaterialBase);
  const panelMesh = new THREE.Mesh(panelGeometry, panelMaterial);
  panelMesh.position.set(PANEL_X, 0, CHASSIS_DEPTH / 2 + 0.005);
  panelMesh.userData.deviceName = name;
  group.add(panelMesh);

  // One LED per real port when we have port data; falls back to a fixed
  // dim placeholder row when a device has no per-port data at all (e.g.
  // real-ping mode, or a device that couldn't be checked this cycle).
  const portCount = (report.ports && report.ports.length > 0) ? report.ports.length : DEFAULT_PORT_LED_COUNT;
  const ports = [];
  const portRowWidth = PANEL_WIDTH * 0.7;
  const portStartX = PANEL_X - portRowWidth / 2;
  for (let i = 0; i < portCount; i++) {
    const portMaterial = new THREE.MeshStandardMaterial({
      color: STATUS_COLOR.unknown,
      emissive: 0x000000,
      emissiveIntensity: 0,
      transparent: true,
      opacity: 1,
      roughness: 0.4,
      metalness: 0.3,
    });
    const port = new THREE.Mesh(ledGeometry, portMaterial);
    const portX = portCount > 1 ? portStartX + (i * portRowWidth) / (portCount - 1) : PANEL_X;
    port.position.set(portX, 0, CHASSIS_DEPTH / 2 + 0.015);
    port.userData.deviceName = name;
    group.add(port);
    ports.push({ mesh: port, material: portMaterial });
  }

  const overallLedMaterial = new THREE.MeshStandardMaterial({
    color: STATUS_COLOR.unknown,
    emissive: 0x000000,
    emissiveIntensity: 0,
    transparent: true,
    opacity: 1,
    roughness: 0.3,
    metalness: 0.1,
  });
  const overallLedMesh = new THREE.Mesh(overallLedGeometry, overallLedMaterial);
  overallLedMesh.position.set(OVERALL_LED_X, 0, CHASSIS_DEPTH / 2 + 0.02);
  overallLedMesh.userData.deviceName = name;
  group.add(overallLedMesh);

  const label = makeLabelSprite(name);
  label.position.set(0, CHASSIS_HEIGHT / 2 + 0.35, 0);
  group.add(label);

  scene.add(group);
  return {
    group,
    chassisMesh,
    panelMesh,
    overallLed: { mesh: overallLedMesh, material: overallLedMaterial },
    ports,
    label,
  };
}

// Master LED state is derived from the ports array, NOT the device's raw
// status — this is a visual aggregation layer only; the device-level
// status used for the text/chat report and its guardrail are unaffected.
function aggregateMasterState(ports) {
  if (!Array.isArray(ports) || ports.length === 0) return "gray";
  if (ports.some((p) => p.status !== "up" && p.status !== "down")) return "gray"; // any "unknown" (or unexpected value)
  const upCount = ports.filter((p) => p.status === "up").length;
  if (upCount === ports.length) return "green-pulse";
  if (upCount === 0) return "red-hard-blink";
  return "orange-blink";
}

// "3 up / 1 down" / "All ports up" / "All ports down" / "Unknown" — the
// same aggregation aggregateMasterState uses, phrased for the side panel.
function summarizePorts(ports) {
  if (!Array.isArray(ports) || ports.length === 0) return "Unknown";
  if (ports.some((p) => p.status !== "up" && p.status !== "down")) return "Unknown";
  const upCount = ports.filter((p) => p.status === "up").length;
  const downCount = ports.length - upCount;
  if (downCount === 0) return "All ports up";
  if (upCount === 0) return "All ports down";
  return `${upCount} up / ${downCount} down`;
}

function makeLabelSprite(text) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "rgba(0,0,0,0)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = "28px sans-serif";
  ctx.fillStyle = "#e6e8eb";
  ctx.textAlign = "center";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 10);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(1.6, 0.4, 1);
  return sprite;
}

function updateDevices(reports) {
  const names = reports.map((r) => r.name);

  reports.forEach((report, index) => {
    let entry = devices.get(report.name);
    if (!entry) {
      entry = buildDevice(report, index, reports.length);
      devices.set(report.name, entry);
    }
    entry.data = report;
  });

  // Drop devices no longer present in the inventory.
  for (const [name, entry] of devices) {
    if (!names.includes(name)) {
      scene.remove(entry.group);
      devices.delete(name);
    }
  }

  if (selectedDevice && devices.has(selectedDevice)) {
    showPanel(devices.get(selectedDevice).data);
  }
}

// New display vocabulary for the status-count strip: HEALTHY / AT RISK /
// OFFLINE / UNKNOWN — never the internal up/down/unknown data values as
// display text. Reuses aggregateMasterState (already defined above for
// the 3D master LED / topology nodes) rather than re-deriving "mixed"
// separately — a device that's device-level "up" but has some ports down
// is AT RISK, not HEALTHY.
function classifyDevice(report) {
  if (report.status === "down") return "offline";
  if (report.status === "unknown") return "unknown";
  const aggregate = aggregateMasterState(report.ports || []);
  return aggregate === "orange-blink" ? "at-risk" : "healthy";
}

function updateStatusCounts(reports) {
  const counts = { healthy: 0, "at-risk": 0, offline: 0, unknown: 0 };
  reports.forEach((r) => { counts[classifyDevice(r)]++; });
  document.getElementById("count-healthy").textContent = counts.healthy;
  document.getElementById("count-at-risk").textContent = counts["at-risk"];
  document.getElementById("count-offline").textContent = counts.offline;
  document.getElementById("count-unknown").textContent = counts.unknown;
}

async function pollStatus() {
  try {
    const res = await fetch("/status");
    const reports = await res.json();
    updateDevices(reports);
    updateStatusCounts(reports);
  } catch (err) {
    console.error("failed to fetch /status", err);
  }
}

pollStatus();
setInterval(pollStatus, 5000);

// --- view tabs (Topology / Rack / List) ---
// LIST has no view built yet (out of scope this round) — its tab is real
// and clickable, but shows an honest placeholder rather than a dead button.

document.querySelectorAll(".view-tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".view-tab").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    const view = btn.dataset.view;
    sceneEl.style.display = view === "3d" ? "block" : "none";
    topologyEl.style.display = view === "topology" ? "block" : "none";
    listViewEl.style.display = view === "list" ? "flex" : "none";
    // #scene has zero layout size while display:none, so the renderer's
    // buffer/camera aspect can only be fixed to the real container size
    // right after it becomes visible again — reading clientWidth/Height
    // here forces the browser to lay it out first.
    if (view === "3d") resizeSceneRenderer();
  });
});

// --- topology view (2D hub-and-spoke SVG) ---
// Reuses aggregateMasterState (node color) and the same STATUS_COLOR
// palette as the 3D master LED, and the same showPanel side panel — no
// separate coloring or detail-panel logic for this view.

function cssColor(hex) {
  return "#" + hex.toString(16).padStart(6, "0");
}

function nodeColor(ports) {
  const state = aggregateMasterState(ports);
  if (state === "green-pulse") return cssColor(STATUS_COLOR.up);
  if (state === "red-hard-blink") return cssColor(STATUS_COLOR.down);
  if (state === "orange-blink") return cssColor(STATUS_COLOR.mixed);
  return cssColor(STATUS_COLOR.unknown);
}

// Line color uses device-level status (not the ports aggregate): green
// only if both ends are confirmed up, red if the hub itself is down
// (that connection is effectively cut regardless of the leaf), orange
// for everything else (exactly one end down/unknown).
function connectionColor(hubStatus, leafStatus) {
  if (hubStatus === "down") return cssColor(STATUS_COLOR.down);
  if (hubStatus === "up" && leafStatus === "up") return cssColor(STATUS_COLOR.up);
  return cssColor(STATUS_COLOR.mixed);
}

function renderTopology(topology) {
  const connections = topology.connections || [];
  const devicesByName = {};
  (topology.devices || []).forEach((d) => { devicesByName[d.name] = d; });

  if (connections.length === 0) {
    topologyEl.innerHTML = '<div style="color:#6b7280; padding: 80px; text-align:center; font-size: 13px;">No topology data.</div>';
    return;
  }

  // Single-hub fixture topology: every connection shares the same source.
  const hubName = connections[0].source;
  const leafNames = connections.map((c) => c.target);

  const width = 900, height = 560;
  const cx = width / 2, cy = height / 2;
  const spokeRadius = Math.min(width, height) * 0.32;
  const hubR = 34, leafR = 26;

  const leafPositions = leafNames.map((name, i) => {
    const angle = -Math.PI / 2 + (i * 2 * Math.PI) / leafNames.length;
    return {
      name,
      x: cx + spokeRadius * Math.cos(angle),
      y: cy + spokeRadius * Math.sin(angle),
    };
  });

  const hubDevice = devicesByName[hubName];
  const hubColor = hubDevice ? nodeColor(hubDevice.ports) : cssColor(STATUS_COLOR.unknown);
  const hubStatus = hubDevice ? hubDevice.status : "unknown";

  const lines = connections.map((conn) => {
    const leafPos = leafPositions.find((p) => p.name === conn.target);
    const leafDevice = devicesByName[conn.target];
    const leafStatus = leafDevice ? leafDevice.status : "unknown";
    const color = connectionColor(hubStatus, leafStatus);
    return `<line x1="${cx}" y1="${cy}" x2="${leafPos.x}" y2="${leafPos.y}" stroke="${color}" stroke-width="3" />`;
  }).join("");

  const leafNodes = leafPositions.map((pos) => {
    const device = devicesByName[pos.name];
    const color = device ? nodeColor(device.ports) : cssColor(STATUS_COLOR.unknown);
    return `
      <g class="topo-node" data-device-name="${pos.name}">
        <circle cx="${pos.x}" cy="${pos.y}" r="${leafR}" fill="${color}" />
        <text class="topo-label" x="${pos.x}" y="${pos.y + leafR + 18}">${pos.name}</text>
      </g>
    `;
  }).join("");

  topologyEl.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}">
      ${lines}
      <g class="topo-node" data-device-name="${hubName}">
        <circle cx="${cx}" cy="${cy}" r="${hubR}" fill="${hubColor}" />
        <text class="topo-label" x="${cx}" y="${cy + hubR + 20}">${hubName}</text>
      </g>
      ${leafNodes}
    </svg>
  `;

  topologyEl.querySelectorAll(".topo-node").forEach((node) => {
    node.addEventListener("click", () => {
      const name = node.dataset.deviceName;
      const device = devicesByName[name];
      if (device) {
        selectedDevice = name;
        showPanel(device);
      }
    });
  });
}

async function pollTopology() {
  try {
    const res = await fetch("/topology");
    const topology = await res.json();
    renderTopology(topology);
  } catch (err) {
    console.error("failed to fetch /topology", err);
  }
}

pollTopology();
setInterval(pollTopology, 5000);

// --- click handling / side panel ---

let selectedDevice = null;
const panel = document.getElementById("panel");
document.getElementById("panel-close").addEventListener("click", () => {
  panel.classList.remove("open");
  selectedDevice = null;
});

function showPanel(data) {
  document.getElementById("panel-name").textContent = data.name;
  document.getElementById("panel-host").textContent = data.host;

  const statusEl = document.getElementById("panel-status");
  statusEl.textContent = data.status;
  statusEl.className = "value status-" + data.status;

  document.getElementById("panel-latency").textContent =
    data.latency_ms == null ? "—" : `${data.latency_ms} ms`;
  document.getElementById("panel-last-checked").textContent = data.last_checked;
  document.getElementById("panel-severity").textContent = data.severity;

  const ports = data.ports || [];
  document.getElementById("panel-port-summary").textContent = summarizePorts(ports);

  const portsList = document.getElementById("panel-ports-list");
  portsList.innerHTML = "";
  if (ports.length === 0) {
    const empty = document.createElement("div");
    empty.className = "ports-empty";
    empty.textContent = "No port data available yet.";
    portsList.appendChild(empty);
  } else {
    ports.forEach((port) => {
      const status = ["up", "down"].includes(port.status) ? port.status : "unknown";
      const row = document.createElement("div");
      row.className = "port-row";
      row.innerHTML = `
        <span class="port-label"><span class="port-dot status-${status}"></span>Port ${port.port}</span>
        <span class="port-status-text status-${status}">${status}</span>
      `;
      portsList.appendChild(row);
    });
  }

  panel.classList.add("open");
}

renderer.domElement.addEventListener("click", (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(
    Array.from(devices.values()).flatMap((e) => [
      e.chassisMesh,
      e.panelMesh,
      e.overallLed.mesh,
      ...e.ports.map((p) => p.mesh),
    ])
  );
  if (hits.length > 0) {
    const name = hits[0].object.userData.deviceName;
    const entry = devices.get(name);
    if (entry) {
      selectedDevice = name;
      showPanel(entry.data);
    }
  }
});

// --- animation loop ---
// Per-port LEDs: green soft-pulse (up) / red hard-blink (down) / dim gray
// static (unknown) — the same three-state language the master LED used
// to use for device-level status.
// Master LED: a separate 4-state aggregation over the ports array —
// green pulse (all up), orange steady/no animation (mixed), red hard
// blink (all down), gray static (any unknown, or no port data).

function setLedState(material, t, state) {
  if (state === "up") {
    const wave = 0.5 + 0.5 * Math.sin(t * 2.2); // slow, soft cycle
    material.color.setHex(STATUS_COLOR.up);
    material.emissive.setHex(STATUS_COLOR.up);
    material.emissiveIntensity = 0.3 + 0.7 * wave;
    material.opacity = 0.7 + 0.3 * wave;
  } else if (state === "down") {
    const on = Math.sin(t * 2.0) > 0; // hard on/off blink
    material.color.setHex(STATUS_COLOR.down);
    material.emissive.setHex(STATUS_COLOR.down);
    material.emissiveIntensity = on ? 1.0 : 0.0;
    material.opacity = on ? 1.0 : 0.35;
  } else {
    material.color.setHex(STATUS_COLOR.unknown);
    material.emissive.setHex(0x000000);
    material.emissiveIntensity = 0;
    material.opacity = 1;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const entry of devices.values()) {
    if (!entry.data) continue;
    const ports = entry.data.ports || [];

    entry.ports.forEach((portEntry, i) => {
      const portStatus = ports[i] ? ports[i].status : "unknown";
      setLedState(portEntry.material, t, portStatus);
    });

    const masterMaterial = entry.overallLed.material;
    switch (aggregateMasterState(ports)) {
      case "green-pulse":
        setLedState(masterMaterial, t, "up");
        break;
      case "red-hard-blink":
        setLedState(masterMaterial, t, "down");
        break;
      case "orange-blink": {
        // Moderate blink: clearly a blink (not a smooth pulse like green),
        // but slower and gentler than the red hard-blink — never fully
        // dark, so a mixed-state device draws attention without reading
        // as urgent as a full outage.
        const on = Math.sin(t * 1.0) > 0; // half the blink rate of "down"
        masterMaterial.color.setHex(STATUS_COLOR.mixed);
        masterMaterial.emissive.setHex(STATUS_COLOR.mixed);
        masterMaterial.emissiveIntensity = on ? 0.9 : 0.25;
        masterMaterial.opacity = on ? 1.0 : 0.6;
        break;
      }
      default: // gray
        setLedState(masterMaterial, t, "unknown");
    }
  }

  renderer.render(scene, camera);
}

animate();

// --- chat bar ---

const chatBar = document.getElementById("chat-bar");
const chatBox = document.getElementById("chat-box");
const chatHistory = document.getElementById("chat-history");
const chatForm = document.getElementById("chat-form");
const chatInput = document.getElementById("chat-input");
const chatSend = document.getElementById("chat-send");

chatBar.addEventListener("click", () => {
  chatBox.classList.toggle("open");
  if (chatBox.classList.contains("open")) chatInput.focus();
});

function appendMessage(text, role) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.textContent = text;
  chatHistory.appendChild(el);
  chatHistory.scrollTop = chatHistory.scrollHeight;
  return el;
}

chatForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = chatInput.value.trim();
  if (!message) return;

  appendMessage(message, "user");
  chatInput.value = "";
  chatInput.disabled = true;
  chatSend.disabled = true;
  const pending = appendMessage("...", "agent pending");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const data = await res.json();
    pending.textContent = data.reply;
    pending.classList.remove("pending");
  } catch (err) {
    pending.textContent = "Sorry, I couldn't reach the server.";
    pending.classList.remove("pending");
  } finally {
    chatInput.disabled = false;
    chatSend.disabled = false;
    chatInput.focus();
  }
});
</script>
</body>
